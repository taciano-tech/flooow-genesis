name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Validate repository
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Validate persistent runtime package
        env:
          FLOOOW_PORT: "18080"
          POSTGRES_PASSWORD: ci-runtime-only
        run: |
          docker compose config --quiet
          docker compose -p flooow-ci up --build --detach
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p flooow-ci logs
          exit 1

      - name: Clean persistent runtime package
        if: always()
        env:
          FLOOOW_PORT: "18080"
          POSTGRES_PASSWORD: ci-runtime-only
        run: docker compose -p flooow-ci down --volumes --remove-orphans
